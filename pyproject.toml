[project]
name = "zarena"
version = "0.1.0"
description = "Moteur de simulation d'arène de combat Dragon Ball Z"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "psutil",
    "joblib",
    "streamlit",
    "folium",
    "streamlit-folium",
    "plotly"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "requests-mock>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["zarena*", "app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: tests de calcul intensif ou de simulation lourde (Monte Carlo)",
]

[project.scripts]
zarena-app = "zarena.cli:launch_app"